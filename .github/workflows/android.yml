
name: Ekramul AI Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'EkramulAI.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Extract project
        run: |
          mkdir source
          unzip -q EkramulAI.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble Debug APK
        run: gradle -p "$PROJECT_DIR" clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EkramulAI-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
